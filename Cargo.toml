[package]
name = "synapse"
version = "0.1.0"
edition = "2021"
description = "Synapse: a living island at the top of the screen, configured by a JSON file."
authors = ["NexusBlck"]
license = "MIT"
repository = "https://github.com/NexusBlck/synapse"
readme = "README.md"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-core = "0.58"
# QR codes for Phone drop (Nayuki's, MIT, no dependencies).
qrcodegen = "1.8"

[dependencies.windows]
version = "0.58"
features = [
    "implement",
    "Foundation",
    "Foundation_Numerics",
    "Foundation_Collections",
    "Devices_Bluetooth",
    "Devices_Enumeration",
    "Media_Control",
    "Storage_Streams",
    "Web_Http",
    "Web_Http_Headers",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Imaging",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Shell_Common",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Power",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Devices_Geolocation",
    "Win32_System_Time",
    "Win32_System_Com_Urlmon",
    "Win32_System_JobObjects",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
